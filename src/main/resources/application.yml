spring:
  application:
    name: "help-desk-backend"
  #datasource configurations
  datasource:
    url: jdbc:mysql://localhost:3306/spring_ai_helpdesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:latest
          temperature: 0.7

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  profiles:
    active: dev


server:
  port: ${PORT_NO}

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
#database configurations

another:
  student: true
ai:
  memory:
     max-messages: 20

jwt:
  secret-key: ${JWT_SECRET}
  expiration: 86400000

# OAuth2 Google with Configure
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

            scope:
              - openid
              - email
              - profile

