# Application Context Path
server:
  servlet:
    context-path: /helpdesk
# Application Name
spring:
  application:
    name: help-desk-backend
  # Active Profile
  profiles:
    active: dev
  # JPA Common Configuration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  # Spring AI Configuration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:latest
          temperature: 0.7
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  # OAuth2 Google Configuration
  spring:
    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
              scope:
                - openid
                - email
                - profile
            github:
              client-id: ${GITHUB_CLIENT_ID}
              client-secret: ${GITHUB_CLIENT_SECRET}
              scope:
                - read:user
                - user:email
# Logging
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
# Custom Application Properties
another:
  student: true
# AI Memory Configuration
ai:
  memory:
    max-messages: 20
# JWT Configuration
jwt:
  secret-key: ${JWT_SECRET}
  expiration: 86400000