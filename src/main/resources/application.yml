# Application Context Path
server:
  servlet:
    context-path: /helpdesk
# Application Name
spring:
  application:
    name: help-desk-backend
  # Active Profile
  profiles:
    active: testing
  # JPA Common Configuration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  # Spring AI Configuration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:latest
          temperature: 0.7
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  # OAuth2 Google Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - openid
              - email
              - profile
# Logging
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
# Custom Application Properties
another:
  student: true
# AI Memory Configuration
ai:
  memory:
    max-messages: 20
# JWT Configuration
jwt:
  secret-key: ${JWT_SECRET}
  expiration: 86400000