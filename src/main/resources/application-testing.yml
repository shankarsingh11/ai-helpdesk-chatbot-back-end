server:
  port: 8081
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/helpdesk_db_testing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
logging:
  level:
    root: INFO
jwt:
  secret-key: ${JWT_SECRET}
  expiration: 86400000